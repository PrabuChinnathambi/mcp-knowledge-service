# ============================================================================
# Secrets — Base template (values overridden by overlays / external secrets)
# ============================================================================
# WARNING: Never commit real values. Use overlays/prod/secrets.yaml with
# sealed-secrets, AWS Secrets Manager, or Vault for real deployments.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mcp-secrets
  namespace: mcp-knowledge
  labels:
    app.kubernetes.io/name: mcp-knowledge-service
type: Opaque
stringData:
  # ---- PostgreSQL ----
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql+asyncpg://admin:CHANGE_ME_IN_PRODUCTION@postgres-svc:5432/mcp-knowledge-service"
  # ---- Redis ----
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_URL: "redis://:CHANGE_ME_IN_PRODUCTION@redis-svc:6379/0"
  # ---- MinIO ----
  MINIO_ENDPOINT: "minio-svc:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  # ---- JWT ----
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_LONG_RANDOM_SECRET"
  # ---- Ollama ----
  OLLAMA_URL: "http://ollama-svc:11434"
