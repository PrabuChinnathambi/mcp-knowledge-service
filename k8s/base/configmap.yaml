apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: mcp-knowledge
  labels:
    app.kubernetes.io/name: mcp-knowledge-service
data:
  APP_NAME: "mcp-knowledge-service"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  EMBEDDING_PROVIDER: "ollama"
  EMBEDDING_MODEL: "nomic-embed-text:latest"
  EMBEDDING_DIMENSIONS: "768"
  LLM_MODEL: "qwen2.5:7b-instruct"
  SUPPORTED_LLM_MODELS: "qwen2.5:7b-instruct,llama3.2:3b,deepseek-r1:1.5b"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "150"
  MIN_RELEVANCE: "0.30"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  MINIO_BUCKET: "knowledge-docs"
  MINIO_SECURE: "false"
  MCP_USER_ID: "alice"
  ALLOWED_TOOLS: "list_collections,search_knowledge,ask_docs,ingest_document"
