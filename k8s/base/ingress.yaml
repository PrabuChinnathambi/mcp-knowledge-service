# ============================================================================
# Kubernetes Ingress — Routes external traffic to the FastAPI REST Gateway
# Requires an Ingress Controller installed in the cluster (e.g. NGINX, Traefik)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-ingress
  namespace: mcp-knowledge
  labels:
    app.kubernetes.io/name: mcp-knowledge-service
  annotations:
    # NGINX Ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Rate limiting at the ingress level (extra layer on top of SlowAPI)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # TLS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Increase body size for document uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.example.com
      secretName: mcp-tls-cert
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 80
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-server-svc
                port:
                  number: 8080
---
# ---- MCP SSE Server Service ----
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-svc
  namespace: mcp-knowledge
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
# ---- MCP SSE Server Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp-knowledge
  labels:
    app: mcp-server
    app.kubernetes.io/name: mcp-knowledge-service
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/prabuChinnathambi/mcp-knowledge-service:latest
          command:
            - uv
            - run
            - python
            - -m
            - apps.mcp_server.main
            - --transport
            - sse
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          ports:
            - containerPort: 8080
              name: sse
          envFrom:
            - configMapRef:
                name: mcp-config
            - secretRef:
                name: mcp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
