# ============================================================================
# Celery Background Worker Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mcp-knowledge
  labels:
    app: worker
    app.kubernetes.io/name: mcp-knowledge-service
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis-svc 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-svc 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: worker
          image: ghcr.io/prabuChinnathambi/mcp-knowledge-service:latest
          command:
            - uv
            - run
            - celery
            - -A
            - apps.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: mcp-config
            - secretRef:
                name: mcp-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - uv
                - run
                - celery
                - -A
                - apps.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
