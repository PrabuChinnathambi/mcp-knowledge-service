apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-knowledge

resources:
  - ../../base

# Production overrides
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: worker

images:
  - name: ghcr.io/prabuChinnathambi/mcp-knowledge-service
    newTag: stable   # Pin to a stable release tag in production

configMapGenerator:
  - name: mcp-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
