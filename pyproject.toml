[project]
name = "mcp-knowledge-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karunakaran", email = "karunakaranguru2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "minio>=7.2.20",
    "pgvector>=0.5.1",
    "pydantic>=2.14.2", 
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-knowledge-service = "mcp_knowledge_service:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

